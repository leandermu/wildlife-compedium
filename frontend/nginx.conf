server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same job as the Vite dev proxy: the app talks to a single origin, so no
    # CORS and no build-time API URL.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Photo uploads and the full-collection ZIP export are large and slow.
        client_max_body_size 200m;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=2592000";
    }

    # React Router owns the routing; unknown paths return the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite hasht die Dateinamen, also darf hart gecacht werden.
    location ~* \.(js|css|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
