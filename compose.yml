services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: wildlife
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wildlife}
      POSTGRES_DB: wildlife
    volumes:
      # Postgres 18+ will den Mount eine Ebene über dem Datenverzeichnis; die
      # Daten landen dann in einem versionierten Unterverzeichnis (nötig für
      # spätere pg_upgrades).
      - wildlife-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wildlife -d wildlife"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    image: wildlife-compedium-backend:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      WC_DATABASE_URL: postgresql+psycopg://wildlife:${POSTGRES_PASSWORD:-wildlife}@db:5432/wildlife
      WC_STORAGE_LOCAL_DIR: /app/data/media
      WC_MEDIA_BASE_URL: /media
      WC_CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    volumes:
      # Nur die Fotos – die Datenbank liegt im db-Dienst.
      - wildlife-media:/app/data/media
    ports:
      # nur für direkten API-Zugriff / Swagger unter /docs
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Einmaliger Lauf: macht aus den beim Bauen geladenen Wikipedia-Vorlagen
  # (/images/original im Image) die entsättigten Referenzplatten im Medien-
  # Volume und trägt Urheber, Lizenz und Quelle bei den Arten ein. Läuft nach
  # dem Backend, weil dessen Start die Arten anlegt, und überspringt sich
  # selbst, sobald die Platten vorhanden sind.
  reference-images:
    build: ./backend
    image: wildlife-compedium-backend:latest
    depends_on:
      backend:
        condition: service_healthy
    environment:
      WC_DATABASE_URL: postgresql+psycopg://wildlife:${POSTGRES_PASSWORD:-wildlife}@db:5432/wildlife
      WC_STORAGE_LOCAL_DIR: /app/data/media
    volumes:
      - wildlife-media:/app/data/media
    command:
      - sh
      - -c
      - |
        if [ -d /app/data/media/reference ] && [ -n "$$(ls -A /app/data/media/reference)" ]; then
          echo "Referenzplatten liegen bereits im Volume – übersprungen."
        elif [ -d /images/original ] && [ -n "$$(ls -A /images/original)" ]; then
          python scripts/process_reference_images.py
        else
          echo "Keine Vorlagen im Image (mit REFERENCE_IMAGES=0 gebaut) – übersprungen."
        fi
    restart: "no"

  # Caddy liefert den Vite-Build aus und ist zugleich der Reverse Proxy
  # für /api und /media (siehe frontend/Caddyfile).
  frontend:
    build: ./frontend
    image: wildlife-compedium-frontend:latest
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  wildlife-db:
  wildlife-media:
